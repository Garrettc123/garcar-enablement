version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garcar
      POSTGRES_PASSWORD: garcar_pass
      POSTGRES_DB: garcar_sales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garcar -d garcar_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
  engine:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://garcar:garcar_pass@db:5432/garcar_sales
  atlas:
    build: .
    command: python atlas_worker.py
    env_file: .env
    depends_on:
      - engine
    environment:
      ENGINE_URL: http://engine:8080
volumes:
  pgdata:
